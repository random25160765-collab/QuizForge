# ============================================================================
# quizforge 考纲主题树
#
# 这是「考纲」的唯一事实来源：
#   - tools/topics.py 解析成扁平节点表，build.py 与 check.py 共用
#   - 前端用它渲染筛选器、主题卡片与统计
#
# 三级结构，类比高中：学科 → 单元 → 知识点
#   学科   ：一整门（C++、CUDA …），对应首页卡片与进度环
#   单元   ：一章（STL 容器与迭代器、执行模型 …）
#   知识点 ：一个考点（迭代器失效、warp 分支发散 …），**题目挂在这一层**
#
# 题目 front-matter 里的 topic 可以写任意一层：写知识点最精确；
# 一时拿不准就先挂在单元上，之后细化了再往下挪。按上层筛选会包含其全部子孙。
#
# 字段说明：
#   key      : 唯一标识；questions/<目录>/ 仍按「学科」组织，目录名 == 一级 key
#   name     : 中文显示名
#   group    : 所属分组，仅一级（学科）需要，用于首页分栏
#   order    : 排序权重，小的排前面
#   color    : 主题色，一级必填，子级默认继承
#   desc     : 一句话描述，显示在学科卡片上
#   children : 下级节点
# ============================================================================

version: 2

groups:
  - key: lang
    name: 编程语言
    order: 10
  - key: gpu
    name: GPU 与加速器
    order: 20
  - key: system
    name: 系统与仿真
