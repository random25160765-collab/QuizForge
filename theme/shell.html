<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="generator" content="QuizForge">
<!--
  主题必须在**样式之前**定下来。
  否则首帧会先用 shell 里写死的 data-theme="dark" 画一屏深色，再被脚本改成
  用户存的浅色 —— 浅色用户每次进这个页面都会先闪一下黑。
  （原先 landing.html / login.html 里各有一份同样的引导 —— 它们随"单用户本地"一起删了。）
-->
<script>
  (function () {
    var theme = 'dark';
    try {
      var saved = JSON.parse(localStorage.getItem('quizforge.v1.settings') || '{}');
      if (saved.theme) theme = saved.theme;
    } catch (e) {}
    document.documentElement.dataset.theme = theme;
  })();
</script>
<!--@INJECT:BASE@-->
<link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-256.png">
  <title>__QUIZFORGE_TITLE__</title>
<!--
  样式注入点。
  离线构建塞 <style> 内联，在线构建塞 <link rel=stylesheet>。
  刻意用「一个粗粒度标记」而不是每份 CSS 一个标记：
  离线与在线共用这一份 shell，顶栏之类的结构才不会两边漂移。
-->
<!--@INJECT:HEAD_ASSETS@-->
</head>
<body data-page="__QUIZFORGE_PAGE__">

<!--
  外壳：活动栏 + 资源栏 + 舞台。
  活动栏与资源栏是**全站共用**的（左边收资源，右边干活），所以它们在外壳里，
  不在任何单个页面里 —— 页面只往舞台的 <main> 里画自己的东西。
  「资源栏装什么」由 sidetree.js 填；「活动栏装什么」由 shell.js 填。
-->
<div class="shell">

  <!-- 活动栏：最左一条窄图标条。页面入口、工具挂载、设置与主题都在这儿。
       它替代了原先挤在顶栏里那排页面按钮 —— 顶栏于是能瘦下来给"打开的标签"用。 -->
  <nav class="rail" aria-label="活动栏">
    <div class="rail__group" id="rail-nav"></div>
    <!-- 工具挂载开关**不在这儿**：它是"对话这一版能调哪些模块"，属于对话服务的一种
         模式（用户的原话："类似 coding agent 的 ask/plan/craft"），所以搬到对话页
         输入框左边那颗模式药丸里（mounts.js 画进 `#chat-modes`，点开是选择栏）。 -->
    <div class="rail__spacer"></div>
    <button class="rail__btn" id="btn-theme" type="button" title="切换浅色/深色主题" aria-label="切换主题">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
      </svg>
    </button>
    <button class="rail__btn" id="btn-settings" type="button" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.3a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.7 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 7 2.6h.1A1.7 1.7 0 0 0 8.7 1V1a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 2.7a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 7v.1a1.7 1.7 0 0 0 1.6 1h.1a2 2 0 1 1 0 4H22a1.7 1.7 0 0 0-1.6 1Z"></path>
      </svg>
    </button>
  </nav>

  <!-- 资源栏：一棵大树，三个根（对话 / 资料 / 笔记）＋ 笔记图谱。
       可整体收起（body[data-side] 控制宽度，见 app.css 的外壳一节；开关在活动栏那颗）。 -->
  <aside class="side" aria-label="资源">
    <div class="side__head">
      <!-- 品牌放在资源栏顶上（参考图里的 VS Code 也是这样）：
           顶栏于是从内容左边缘开始，练习中心那排按钮能与下面对齐 -->
      <a class="brand side__brand" href="index.html" aria-label="QuizForge 首页" title="返回首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="14.4" cy="14.4" r="8.4"></circle>
            <path d="M20.6 20.6 L26.4 26.4"></path>
          </svg>
        </span>
      </a>
      <span class="side__title" id="side-title">资源</span>
      <!-- 收起这颗资源栏（活动栏那颗改成"进入资源页"了，所以这儿不再重复） -->
      <button class="side__fold" id="side-fold" type="button" title="收起资源栏（Alt+B）" aria-label="收起资源栏">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 6 8.5 12l6 6"></path>
        </svg>
      </button>
      <!-- 这里原先还有一个「收起资源栏」的箭头 —— 活动栏里那颗 `side` 按钮做的就是
           同一件事，两处并存容易让人以为它们收的不是同一样东西。用户说"只留左边"，删掉。 -->
    </div>
    <div class="side__body" id="side-body">
      <!-- 资源树由 sidetree.js 填（对话 / 资料 / 笔记 三个根 + 笔记图谱）。
           还没接上之前先不说空话 —— 树是懒加载的，空面板只在一瞬间。 -->
    </div>
  </aside>

  <div class="stage">
    <!-- 顶栏瘦身：只剩品牌 + 页面自己的子导航（刷题页那四个视图）+ 同步提示。
         登录/退出的跳转随"单用户本地"一起没了，这里也不再有那排页面按钮。 -->
    <header class="topbar" role="banner">
      <div class="topbar-inner">
        <nav class="mainnav" id="mainnav" aria-label="主导航"></nav>

        <div class="topbar-actions">
          <!-- 同步异常提示。正常同步时整块不渲染 ——
               跨设备场景下用户需要知道的只有「出问题了」，不是「正在同步」。 -->
          <button class="sync-note" id="sync-note" type="button" hidden
                  title="点击立即重试" aria-live="polite"></button>
        </div>
      </div>
      <div class="topbar-progress" id="topbar-progress" aria-hidden="true"></div>
    </header>

    <main class="view" id="view" role="main">
    <!--@INJECT:BODY@-->
    </main>

    <footer class="statusbar" id="statusbar" role="contentinfo"></footer>
  </div>
</div>

<div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>
<div class="modal-root" id="modal-root" hidden></div>

<!-- 脚本注入点：离线构建内联全部脚本，在线构建按序引入 /assets/runtime/*.js -->
<!--@INJECT:SCRIPTS@-->
</body>
</html>
