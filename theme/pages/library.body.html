<!-- 资料页（2026-11-08）：云端资料管理台。

     布局照对话页的左右分栏：
       左栏：动作图标 · 上传 · 流水线 · 账目（区与区之间只有一条分割线，没有卡片）
       右栏（看板）：矩阵树 / 列表 两个视图

     正文由 `runtime/library.js` 渲染，样式在 `library.css`。 -->
<div class="view">
  <div class="libsplit">
    <aside class="libaside">
      <!-- 上传放在最上面，一层虚线框就是它自己的边界 -->
      <section class="libblock">
        <div class="libdrop" id="lib-drop" role="button" tabindex="0">
          <span class="libdrop__icon" aria-hidden="true">＋</span>
          <span class="libdrop__text">拖入文件，或点击选择</span>
          <input type="file" id="lib-file" multiple hidden>
        </div>
      </section>

      <section class="libblock">
        <div class="libblock__head">
          <h2 class="libblock__title">流水线</h2>
          <button class="libblock__act" id="lib-toggle" type="button" title="暂停流水线"></button>
        </div>
        <div class="libflow" id="lib-flow"></div>
        <div class="libqueue" id="lib-queue"></div>
      </section>

      <section class="libblock">
        <div class="libfacts" id="lib-kpi" aria-label="库存"></div>
      </section>

      <!-- 两个动作沉在左下角：顶部就别再占一行（页面名在活动栏上写着） -->
      <div class="libaside__acts">
        <button class="icon-btn libact" id="lib-refresh" type="button" title="刷新" aria-label="刷新"></button>
        <button class="icon-btn libact libact--pri" id="lib-push" type="button" title="同步到云端" aria-label="同步到云端"></button>
      </div>

      <!-- 右边界可拖：压在 1px 边框上，平时隐形，悬停/拖动时才亮一道 -->
      <div class="libgrip" id="lib-grip" role="separator" aria-orientation="vertical"
           aria-label="调整左栏宽度"></div>
    </aside>

    <main class="libmain">
      <div class="libmain__head">
        <!-- 开关放在主区最左：左栏收起后它仍在，才收得回来（与对话页同一处位置） -->
        <button class="icon-btn libact libfold" id="lib-fold" type="button"
                title="收起左栏（⌘/Ctrl+B）" aria-label="收起左栏" aria-expanded="true"></button>
        <h2 class="libmain__title">资料看板</h2>
        <!-- 选中的那一份就地显示在标题行里，不再单独占一条（那一条与左栏的账重复） -->
        <div class="libpicked" id="lib-pick" hidden></div>
        <div class="libviews" id="lib-views">
          <button type="button" data-view="tree">矩阵树</button>
          <button type="button" data-view="list" class="is-on">列表</button>
        </div>
      </div>

      <div class="libtree" id="lib-tree" hidden></div>
      <div class="libtree__legend" id="lib-legend" hidden></div>
      <div class="liblist" id="lib-list"></div>
    </main>
  </div>
</div>
