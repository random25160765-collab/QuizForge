<!--
  笔记：写作台。布局照 Obsidian —— **左边是文件面板，右边是正文，最右是可选侧栏**；
  正文有自己的标签页栏与面包屑，底部一条状态栏。

  这里**没有**应用自己的图标栏：外壳的活动栏已经在最左边，再并一条 46px 的图标列
  就是两条挨着（用户："意义不明且和左边的一排按钮形成重复"）。面板的切换在右侧栏
  顶部那排带字的页签里，展开/收起在正文标签栏右端那颗 —— 都有，不用第三处。

  为什么不是"三栏 + 文章容器"：
  * 这一页是**应用面**，不是一篇文档 —— 浏览器多宽它就该多宽。上一版被页面的居中容器
    （`app.css` 的 `.view { max-width: 1280px }`）套住，两边各留一大条空白，
    中间还空着，看着像坏了。`notes.css` 里显式取消了那条约束。
  * 标签页与面包屑是这个体量下**必须**的东西：库里 91 篇、目录四五层，
    没有"我开过哪几篇、现在这篇在哪一层"，来回找文件会把人磨死。

  `data-page` 必须写：页面级样式与顶栏图标隐藏都靠它（见 app.css 的 body[data-page] 规则）。
-->
<div id="app-root" data-page="notes">
  <div class="notes" id="notes-root" data-side="open">
    <!-- 文件面板：库 → 搜索 → 树 → 页脚（库名与设置） -->
    <aside class="nfiles" id="notes-files" aria-label="笔记列表">
      <header class="nfiles__head">
        <select class="nfiles__lib" id="notes-lib" title="笔记库" aria-label="笔记库"></select>
        <button class="nicon" id="notes-new" type="button" title="新建笔记（⌘O 同级 / ⌘P 子级）"
                aria-label="新建笔记">＋</button>
      </header>
      <div class="nfiles__searchrow">
        <input class="nfiles__search" id="notes-search" type="search" placeholder="搜索…（支持 #标签 / title: / -词）"
               autocomplete="off" spellcheck="false" aria-label="搜索笔记">
        <button class="nicon nicon--mini" id="notes-clear" type="button" title="清空检索"
                aria-label="清空检索" hidden>×</button>
      </div>
      <!-- 条目数与「全部展开」固定在这里：它是**面板的一部分**，不是列表的第一行。
           放在滚动区里做粘性元素时，滚动的行会从它缝隙里透出来（实测能看到半行文字） -->
      <div class="nfiles__bar" id="notes-treebar"></div>
      <div class="nfiles__scroll" id="notes-tree" role="tree"></div>
      <footer class="nfiles__foot">
        <!-- 这里原先还有一颗「⇅ 全部展开/收起」：它**没有任何处理器**（点了不动），
             而上面树栏里已经有一颗同样作用的。删掉，只留树上那一颗。 -->
        <span class="nfiles__vault" id="notes-vault">—</span>
      </footer>
    </aside>

    <!-- 主区：标签页 / 面包屑 / 正文 / 状态栏，全部由 notes.js 渲染 -->
    <main class="nmain" id="notes-main"></main>

    <!-- 右侧栏：一次显示一个面板（大纲 / 反链 / 属性 / 历史 / 排版） -->
    <aside class="nside" id="notes-side" aria-label="笔记侧栏"></aside>
  </div>
</div>
