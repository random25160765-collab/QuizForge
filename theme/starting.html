<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="generator" content="QFStudio">
  <link rel="icon" type="image/svg+xml" href="mark.svg?v=2">
  <link rel="stylesheet" href="starting.css">
  <script>
    // 跟着用户上次选的深浅色走（与 shell.html 读同一份设置）
    try {
      var saved = JSON.parse(localStorage.getItem('quizforge.v1.settings') || '{}');
      if (saved && saved.theme) document.documentElement.dataset.theme = saved.theme;
    } catch (err) { /* 读不出来就用默认（深色） */ }
  </script>
  <title>QFStudio</title>
</head>
<body>
  <!-- 只有三样东西：标、名、进度。没有清单、没有百分比、没有"仍然进入"——
       检查没通过就停在这儿并说明是哪一项，不给人绕过检查的入口。 -->
  <main class="stage">
    <img class="mark" src="icon.svg" width="64" height="64" alt="">
    <h1 class="name">QFStudio</h1>
    <div class="track" id="track" role="progressbar" aria-labelledby="status"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="track__fill" id="fill"></div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">正在准备</p>
    <p class="detail" id="detail" hidden></p>
    <button class="retry" id="retry" type="button" hidden>重试</button>
  </main>

  <script>
    (function () {
      var fill = document.getElementById('fill');
      var track = document.getElementById('track');
      var status = document.getElementById('status');
      var detail = document.getElementById('detail');
      var retry = document.getElementById('retry');
      var settled = false;
      var misses = 0;

      function paint(payload) {
        var percent = Math.round((payload.progress || 0) * 100);
        fill.style.width = percent + '%';
        track.setAttribute('aria-valuenow', String(percent));

        var failures = (payload.steps || []).filter(function (s) { return s.status === 'fail'; });
        if (failures.length) {
          status.textContent = failures.map(function (s) { return '「' + s.label + '」'; }).join('') + '没通过';
          status.classList.add('status--bad');
          detail.textContent = failures.map(function (s) { return s.detail; }).filter(Boolean).join('；');
          detail.hidden = !detail.textContent;
          retry.hidden = false;
          return false;
        }

        status.textContent = percent >= 100 ? '就绪' : '正在准备';
        status.classList.remove('status--bad');
        detail.hidden = true;
        retry.hidden = true;
        return percent >= 100;
      }

      // `?stay=1` 停在启动页不跳 —— 想看检查结果、或截图留证时用（默认会自动进入）
      var stay = new URLSearchParams(location.search).has('stay');

      function tick() {
        // 服务可能还没起来（启动页会比服务先出现，尤其是首次运行时）——
        // 拿不到就继续问，别把"稍等一下"显示成"出错了"
        fetch('api/startup', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (payload) {
            misses = 0;
            if (paint(payload)) {
              if (!stay) {
                settled = true;
                location.replace('workbench.html');
              }
              return;
            }
          })
          .catch(function () {
            misses += 1;
            // 十几秒都没有回应：本机服务大概根本没起来。文字仍然只有一行。
            if (misses >= 12) status.textContent = '正在等待本机服务';
          })
          .then(function () {
            if (!settled) setTimeout(tick, 400);
          });
      }

      // 失败只能重试，不能进 —— 检查没过就应该是没过
      retry.addEventListener('click', function () { location.reload(); });
      tick();
    })();
  </script>
</body>
</html>
