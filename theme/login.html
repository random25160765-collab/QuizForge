<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="generator" content="quizforge">
<title>登录 · QuizForge</title>
<script>
  // 与刷题应用共用同一份主题设置，避免登录页与应用之间闪一下深浅切换
  try {
    var s = JSON.parse(localStorage.getItem('quizforge.v1.settings') || '{}');
    if (s.theme) document.documentElement.dataset.theme = s.theme;
  } catch (e) {}
</script>
<style>
/* 跨文档导航（登录页 ⇄ 刷题页）交给 View Transitions，与应用侧同一套 */
@view-transition { navigation: auto; }
:root {
  --bg: #0B1016; --bg2: #131A22; --bg3: #1E2936;
  --fg: #E6EDF3; --fg2: #9AA7B4; --fg3: #75838F;
  --pri: #2DD4BF; --pri-2: #14B8A6; --pri-3: #5EEAD4;
  --bad: #F87171; --ok: #34D399;
  --line: #2A3846; --line-strong: #3E5163;
  --ink: #04211C;
  --edge-hi: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --font-sans: 'Source Han Sans SC', 'Noto Sans CJK SC', '思源黑体', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.3, 1);
}
html[data-theme='light'] {
  --bg: #FAFBFC; --bg2: #FFFFFF; --bg3: #EDF1F5;
  --fg: #0F1A24; --fg2: #4A5A68; --fg3: #6F7F8E;
  --pri: #14B8A6; --pri-2: #0D9488; --pri-3: #0E7C6B;
  --bad: #DC2626; --ok: #059669;
  --line: #E2E8EE; --line-strong: #C8D3DE;
  --ink: #FFFFFF;
  --edge-hi: inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection { background: color-mix(in srgb, var(--pri) 30%, transparent); }
:focus-visible { outline: 2px solid var(--pri); outline-offset: 3px; border-radius: 10px; }

/* 与首页同一套背景：一层顶光 + 淡网格 */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.bg::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(820px 420px at 50% -12%,
    color-mix(in srgb, var(--pri) 11%, transparent), transparent 70%);
}
.bg::after {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, color-mix(in srgb, var(--line-strong) 55%, transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in srgb, var(--line-strong) 55%, transparent) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(ellipse 62% 52% at 50% 30%, #000, transparent 76%);
  mask-image: radial-gradient(ellipse 62% 52% at 50% 30%, #000, transparent 76%);
  opacity: .45;
}

.wrap {
  position: relative; z-index: 1;
  flex: 1 1 auto;
  width: 100%; max-width: 430px;
  margin: 0 auto;
  padding: 22px clamp(20px, 5vw, 32px) 30px;
  display: flex; flex-direction: column;
}

.top { display: flex; align-items: center; justify-content: flex-end; }
.themebtn {
  display: grid; place-items: center;
  width: 34px; height: 34px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg2) 70%, transparent);
  color: var(--fg3);
  cursor: pointer;
  box-shadow: var(--edge-hi);
  transition: color .18s var(--ease), border-color .18s var(--ease);
}
.themebtn:hover { color: var(--fg); border-color: var(--line-strong); }

.brandwrap { display: flex; flex-direction: column; align-items: center; margin-top: clamp(24px, 7vh, 64px); }
.logo { display: block; height: 54px; width: auto; overflow: visible; }
.logo__word { font-family: 'Ubuntu Sans', 'Ubuntu', var(--font-sans); font-size: 41px; font-weight: 650; letter-spacing: -0.03em; fill: var(--fg); }
.logo__g1 { stop-color: var(--pri-3); }
.logo__g2 { stop-color: var(--pri); }
.logo__g3 { stop-color: var(--pri-2); }
.logo__glyph { stroke: var(--ink); }
.tagline { margin: 14px 0 0; color: var(--fg3); font-size: 13px; letter-spacing: 0.28em; text-indent: 0.28em; }

.card {
  margin-top: 28px;
  padding: 22px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg2) 88%, transparent);
  backdrop-filter: blur(14px);
  box-shadow: var(--edge-hi), 0 24px 60px -40px rgba(0, 0, 0, .8);
}

/* 登录 / 注册 分段控件 */
.tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  padding: 4px;
  border-radius: 12px;
  background: var(--bg3);
  margin-bottom: 18px;
}
.tab {
  padding: 8px 0;
  border: 0; border-radius: 9px;
  background: transparent;
  color: var(--fg2);
  font: inherit; font-size: 14px; font-weight: 500;
  cursor: pointer;
  transition: background .18s var(--ease), color .18s var(--ease);
}
.tab:hover { color: var(--fg); }
.tab.is-on {
  background: var(--bg2);
  color: var(--fg);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25), var(--edge-hi);
}

/* 作者样式（.field{display:block}）会盖掉 [hidden] 的 UA 规则，
   导致「登录」模式下昵称字段依然可见。这里显式兜底。 */
[hidden] { display: none !important; }

.field { display: block; margin-bottom: 14px; }
.field__label { display: block; font-size: 12.5px; color: var(--fg2); margin-bottom: 6px; }
.input {
  width: 100%;
  height: 42px;
  padding: 0 13px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--fg);
  font: inherit; font-size: 14px;
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.input::placeholder { color: var(--fg3); }
.input:focus {
  outline: none;
  border-color: color-mix(in srgb, var(--pri) 60%, var(--line));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--pri) 16%, transparent);
}
.input:disabled { opacity: .6; }

.submit {
  width: 100%; height: 44px;
  margin-top: 6px;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  border: 1px solid color-mix(in srgb, var(--pri-3) 45%, transparent);
  border-radius: 11px;
  background: linear-gradient(180deg, var(--pri-3), var(--pri) 55%, var(--pri-2));
  color: var(--ink);
  font: inherit; font-size: 15px; font-weight: 600;
  cursor: pointer;
  box-shadow: var(--edge-hi), 0 14px 30px -16px color-mix(in srgb, var(--pri) 60%, transparent);
  transition: transform .18s var(--ease), filter .18s var(--ease);
}
.submit:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
.submit:active:not(:disabled) { transform: translateY(0); filter: brightness(.97); }
.submit:disabled { opacity: .65; cursor: default; }

/* 错误条：只有出错时才占位 */
.alert {
  display: none;
  align-items: flex-start; gap: 9px;
  margin-bottom: 14px;
  padding: 10px 12px;
  border-radius: 11px;
  border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
  background: color-mix(in srgb, var(--bad) 10%, transparent);
  color: var(--bad);
  font-size: 13px;
  line-height: 1.55;
}
.alert.is-on { display: flex; animation: shake .28s var(--ease); }
.alert svg { flex: none; margin-top: 2px; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}

.hint { margin: 16px 0 0; font-size: 12px; color: var(--fg3); text-align: center; }
.hint a { color: var(--pri); text-decoration: none; }
.hint a:hover { text-decoration: underline; }

.spinner {
  width: 15px; height: 15px; flex: none;
  border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--ink) 30%, transparent);
  border-top-color: var(--ink);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .001ms !important; animation-duration: .001ms !important; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div class="wrap">
  <div class="top">
    <button class="themebtn" id="theme" type="button" title="切换浅色 / 深色" aria-label="切换主题">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
      </svg>
    </button>
  </div>

  <div class="brandwrap">
    <svg class="logo" viewBox="0 12 282 64" role="img" aria-label="QuizForge">
      <defs>
        <linearGradient id="qf-tile" x1="0" y1="0" x2="1" y2="1">
          <stop class="logo__g1" offset="0"></stop>
          <stop class="logo__g2" offset="0.45"></stop>
          <stop class="logo__g3" offset="1"></stop>
        </linearGradient>
      </defs>
      <rect x="0" y="12" width="64" height="64" rx="19" fill="url(#qf-tile)"></rect>
      <g class="logo__glyph" transform="translate(0,12) scale(2)" fill="none"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 21 L12 8 L19 21"></path>
        <path d="M8.2 16.4 h7.6"></path>
        <path d="M22.5 10.5 v11"></path>
        <path d="M22.5 21.5 c3.2 0 4.6-1.6 5-4.6"></path>
      </g>
      <text class="logo__word" x="86" y="59">Quiz<tspan font-weight="400">Forge</tspan></text>
    </svg>
    <p class="tagline">进度随手边设备走</p>
  </div>

  <form class="card" id="form" novalidate>
    <div class="tabs" role="tablist">
      <button class="tab is-on" type="button" data-mode="login" role="tab">登录</button>
      <button class="tab" type="button" data-mode="register" role="tab">注册</button>
    </div>

    <div class="alert" id="alert" role="alert">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4 2.5 20h19Z"></path><path d="M12 10v4.5M12 17.4v.2"></path>
      </svg>
      <span id="alert-text"></span>
    </div>

    <label class="field" id="name-field" hidden>
      <span class="field__label">昵称（可留空）</span>
      <input class="input" id="name" type="text" autocomplete="nickname" placeholder="怎么称呼你" maxlength="64">
    </label>

    <label class="field">
      <span class="field__label">邮箱</span>
      <input class="input" id="email" type="email" autocomplete="username" placeholder="you@example.com" required>
    </label>

    <label class="field">
      <span class="field__label">密码</span>
      <input class="input" id="password" type="password" autocomplete="current-password" placeholder="至少 8 位" required>
    </label>

    <button class="submit" id="submit" type="submit">
      <span id="submit-label">登录</span>
    </button>

    <p class="hint" id="hint">还没有账号？点上面的「注册」。</p>
  </form>
</div>

<script>
(function () {
  'use strict';

  var API = (window.QF_CONFIG && window.QF_CONFIG.apiBase) || '/api';
  var params = new URLSearchParams(location.search);
  var next = params.get('next') || '';
  // 只接受站内相对路径，避免被构造成开放重定向
  if (!next || next.charAt(0) !== '/' || next.slice(0, 2) === '//') next = '/quiz.html';

  var mode = 'login';
  var busy = false;

  var form = document.getElementById('form');
  var tabs = [].slice.call(document.querySelectorAll('.tab'));
  var alertBox = document.getElementById('alert');
  var alertText = document.getElementById('alert-text');
  var nameField = document.getElementById('name-field');
  var nameInput = document.getElementById('name');
  var emailInput = document.getElementById('email');
  var passwordInput = document.getElementById('password');
  var submitBtn = document.getElementById('submit');
  var submitLabel = document.getElementById('submit-label');
  var hint = document.getElementById('hint');

  /* ------------------------------------------------------------ 主题 */
  document.getElementById('theme').onclick = function () {
    var nextTheme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = nextTheme;
    try {
      var s = JSON.parse(localStorage.getItem('quizforge.v1.settings') || '{}');
      s.theme = nextTheme;
      localStorage.setItem('quizforge.v1.settings', JSON.stringify(s));
    } catch (e) {}
  };

  /* ------------------------------------------------------------ 提示 */
  function showAlert(message) {
    alertText.textContent = message;
    alertBox.classList.add('is-on');
  }
  function clearAlert() {
    alertBox.classList.remove('is-on');
    alertText.textContent = '';
  }
  function setBusy(on) {
    busy = on;
    submitBtn.disabled = on;
    [emailInput, passwordInput, nameInput].forEach(function (el) { el.disabled = on; });
    if (on) {
      submitLabel.textContent = mode === 'login' ? '登录中…' : '注册中…';
      if (!submitBtn.querySelector('.spinner')) {
        var sp = document.createElement('span');
        sp.className = 'spinner';
        submitBtn.insertBefore(sp, submitLabel);
      }
    } else {
      var spinner = submitBtn.querySelector('.spinner');
      if (spinner) spinner.remove();
      submitLabel.textContent = mode === 'login' ? '登录' : '注册';
    }
  }

  /* ------------------------------------------------------------ 模式 */
  function setMode(nextMode) {
    mode = nextMode;
    tabs.forEach(function (tab) {
      tab.classList.toggle('is-on', tab.dataset.mode === mode);
    });
    nameField.hidden = mode !== 'register';
    passwordInput.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
    passwordInput.placeholder = mode === 'login' ? '至少 8 位' : '至少 8 位，别用生日';
    hint.innerHTML = mode === 'login'
      ? '还没有账号？点上面的「注册」。'
      : '已经有账号了？点上面的「登录」。';
    clearAlert();
    setBusy(false);
    (mode === 'register' ? nameInput : emailInput).focus();
  }

  tabs.forEach(function (tab) {
    tab.onclick = function () {
      if (busy || tab.dataset.mode === mode) return;
      setMode(tab.dataset.mode);
    };
  });

  /* ------------------------------------------------------------ 请求 */
  function csrf() {
    var m = document.cookie.match(/(?:^|;\s*)qf_csrf=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  function post(path, body) {
    return fetch(API + path, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf() },
      body: JSON.stringify(body),
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.ok) return data;
        var err = new Error((data && data.detail) || ('请求失败（' + res.status + '）'));
        err.status = res.status;
        throw err;
      });
    }, function () {
      var err = new Error('网络不可用，请检查连接后重试');
      err.status = 0;
      throw err;
    });
  }

  /** 把接口错误翻译成人话。后端刻意不区分「邮箱不存在」与「密码错误」，这里也不猜。 */
  function friendly(err) {
    if (err.status === 422) return '邮箱或密码格式不正确（密码至少 8 位）。';
    if (err.status === 401) return '邮箱或密码不正确。';
    if (err.status === 409) return '该邮箱已注册，直接登录即可。';
    if (err.status === 429) return err.message;
    return err.message || '出了点问题，请稍后重试';
  }

  form.onsubmit = function (event) {
    event.preventDefault();
    if (busy) return;

    var email = emailInput.value.trim();
    var password = passwordInput.value;
    if (!email || !password) {
      showAlert('请填写邮箱和密码。');
      return;
    }
    if (mode === 'register' && password.length < 8) {
      showAlert('密码至少 8 位。');
      return;
    }

    clearAlert();
    setBusy(true);
    var call = mode === 'login'
      ? post('/auth/login', { email: email, password: password })
      : post('/auth/register', { email: email, password: password, displayName: nameInput.value.trim() });

    call.then(function () {
      location.replace(next);
    }).catch(function (err) {
      setBusy(false);
      showAlert(friendly(err));
      // 把已登录的情况当作成功：可能只是上一个会话还没过期
      if (err.status === 409) setMode('login');
    });
  };

  /* ------------------------------------------------------ 已登录则直接放行 */
  fetch(API + '/auth/me', { credentials: 'same-origin' })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (data) {
      if (data && data.user) location.replace(next);
    })
    .catch(function () {});

  // 带 ?mode=register 直达注册（首页的「注册」入口用）
  setMode(params.get('mode') === 'register' ? 'register' : 'login');
  emailInput.focus();
})();
</script>
</body>
</html>
