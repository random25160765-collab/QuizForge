<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="generator" content="quizforge">
<title>__LANDING_TITLE__</title>
<script>
  // 提前套用已保存的主题，避免首屏闪一下深色
  try {
    var s = JSON.parse(localStorage.getItem('quizforge.v1.settings') || '{}');
    if (s.theme) document.documentElement.dataset.theme = s.theme;
  } catch (e) {}
</script>
<style>
/* 跨文档导航交给 View Transitions：旧页面留成快照垫在底下，
   新页面加载与首帧渲染期间不会直接切过去。应用侧（theme/app.css）也声明了同一句。 */
@view-transition { navigation: auto; }

/* ---------------------------------------------------------------- 字体 */
/* slogan 走等宽斜体加粗：Ubuntu Mono，一个字宽 0.56em —— 字重和斜体都不改变步进，
   所以行宽可以直接算出来（26 字 = 14.56em）。等宽的好处是节奏均匀，
   斜体让它带一点手写感，加粗保证在粒子上压得住。字标仍用无衬线，与图形标记是一套。

   顺带记下这一版 Chrome 的脾气，省得下次再试一遍：
     font-weight  ✔ 真能换到不同字重实例（400 → 700 笔画多 55%）
     font-stretch ✔ 真能换到不同字宽实例，但只认具名实例（≤87.5% 全落到同一个压缩档）
     font-variation-settings ✘ 写了没用，仍停在默认实例；@font-face + local() 也救不了 */

/* ---------------------------------------------------------------- 调色 */
/* 这页只有黑与白，深色档就是浅色档的黑白互换（反色）。
   彩色全部交给背景粒子：紫与绿在画布里呼吸，页面本身不着色。 */
:root {
  --bg: #FAFAFA; --fg: #0A0A0A;
  --fg2: #565656; --fg3: #9A9A9A;
  /* slogan 自己的墨色：比 --fg 柔一档，不做纯黑纯白，也不加渐变。
     两档都往背景方向压 —— 浅色档抬一点、深色档降一点，对比同步变软。 */
  --ink-slogan: #282828;
  /* 彩蛋那行：坐在 --fg2 与 --fg3 之间 —— 比 --fg2 灰，又不至于糊进雾里 */
  --ink-egg: #7C7C7C;
  /* 唯一的彩色：字标尾部那枚光标，与背景粒子同源 */
  --acc-1: #7C3AED; --acc-2: #0D9488;
  --line: color-mix(in srgb, var(--fg) 16%, transparent);
  --font-sans: 'Source Han Sans SC', 'Noto Sans CJK SC', '思源黑体', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  /* 字标与 slogan 共用：等宽 + 斜体 + 粗。行宽可算（见文件头），字号上限也是算出来的 */
  --font-slogan: 'Ubuntu Mono', 'Ubuntu Sans Mono', 'DejaVu Sans Mono', ui-monospace, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.3, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
html[data-theme='dark'] {
  --bg: #0A0A0A; --fg: #FAFAFA;
  --fg2: #B0B0B0; --fg3: #6E6E6E;
  --ink-slogan: #D6D6D6;
  --ink-egg: #909090;
  --acc-1: #A78BFA; --acc-2: #2DD4BF;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection { background: color-mix(in srgb, var(--fg) 16%, transparent); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; border-radius: 12px; }
a { color: inherit; }

/* ---------------------------------------------------------------- 背景 */
/* 一块画布：单色尘埃 + 紫绿粒子 + 几团缓慢漂移的模糊光斑。
   位置与相位每次进入都随机 —— 它不讨好谁，只是自己在那里呼吸。 */
#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ---------------------------------------------------------------- 主视觉 */
/* 整页只有三层：Logo（入口）→ slogan → 彩蛋。大号居中，不推销任何功能。 */
.hero {
  position: relative; z-index: 1;
  min-height: 100vh; min-height: 100dvh;
  display: grid; place-content: center; justify-items: center;
  padding: 0 24px;
  text-align: center;
}

/* Logo：图形标记 + 双色字标（Quiz 粗 / Forge 细）。
   砖与字黑白反色：浅色档黑砖白字，深色档白砖黑字，不用第二套资源。 */
.brand {
  display: inline-flex; align-items: baseline; gap: .12em;
  margin-bottom: 48px;
  font-size: clamp(34px, 4.4vw, 60px);
  text-decoration: none;
  color: var(--ink-slogan);
  transition: opacity .18s var(--ease), transform .18s var(--ease);
}
.brand:hover { opacity: .78; transform: translateY(-2px); }
.brand__word {
  font-family: var(--font-slogan);
  font-style: italic; font-weight: 700;
  font-size: 1em; letter-spacing: -0.02em; line-height: 1;
}
/* 尾部的方块光标：跟着斜体一起倾一点，高度取字高（.74em ≈ 等宽字的字高）。
   它是整页唯一的彩色 —— 紫与绿直接取自背景粒子，等于这页给自己的签名。 */
.brand__caret {
  width: .46em; height: .74em;
  transform: translateY(.06em) skewX(-12deg);
  background: linear-gradient(180deg, var(--acc-1), var(--acc-2));
}

/* slogan：巨大、纤细、笃定。
   280 的字重 + 94% 的字宽（可变字体两个轴一起用）是这版的骨架：
   大字号下不松散，也不飘。底部再压一层极淡的渐变，像金属的反光。 */
.slogan-wrap { position: relative; }
.slogan {
  margin: 0;
  font-family: var(--font-slogan);
  font-style: italic;
  font-weight: 700;
  /* 25 字 × 0.56em = 14em：84px → 行宽 1176px，1440 视口下两侧各留 100px 以上。
     下限按最窄的手机算：375px 视口剩 327px 可用，327 ÷ 14em ≈ 23px */
  font-size: clamp(20px, 6vw, 84px);
  letter-spacing: 0;
  line-height: 1.14;
  color: var(--ink-slogan);
  /* 静止时也留一层很轻的模糊：笔画边缘不割手，像刻完又磨过一遍。
     0.5px 在数值上已经基本等同锐边（实测过渡带只比 0px 多几个百分点），
     所以「柔」这件事现在主要落在墨色上，不在半径上。 */
  filter: blur(.5px);
  transition: filter .95s var(--ease), opacity .95s var(--ease);
  will-change: filter;
  cursor: default;
}
/* 彩蛋浮现时，表层失焦让位给内核。
   透明度压到 .3：小字要压在这层白雾上，雾太亮就读不清了。 */
body.egg-on .slogan { filter: blur(10px); opacity: .3; }
/* 移开指针要「立马」回到原样：这一档把过渡关掉 */
body.egg-reset .slogan, body.egg-reset .egg { transition: none; }

/* 彩蛋：同字体同字重，小一半，实色灰。
   位置与 slogan 重合（inset 铺满 slogan 那行，内部居中），
   所以表层失焦散开之后，它正好从原位浮出来 —— 不另起一行，不挤排版。 */
.egg {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  margin: 0;
  transform: translateY(10px);
  font-family: var(--font-slogan);
  font-style: italic;
  font-weight: 700;
  /* 40 字 × 0.56em：42px → 行宽 940px，稳稳落在 1223px 的 slogan 里 */
  font-size: clamp(13px, 3.2vw, 42px);
  letter-spacing: 0;
  line-height: 1.2;
  /* 专用墨色：比表层灰，但不落到 --fg3 那么淡（身下还垫着一层失焦的雾） */
  color: var(--ink-egg);
  text-align: center;
  opacity: 0;
  transition: opacity 1s var(--ease) .35s, transform 1s var(--ease) .35s;
  pointer-events: none;
}
body.egg-on .egg { opacity: 1; transform: none; }

/* ---------------------------------------------------------------- 角落 */
/* 主题钮：唯一的控件，幽灵式 —— 这页的主角不是它。 */
.themebtn {
  position: fixed; top: 14px; right: 16px; z-index: 2;
  display: grid; place-items: center;
  width: 36px; height: 36px;
  border: 0; border-radius: 10px;
  background: transparent; color: var(--fg3); cursor: pointer;
  transition: color .18s var(--ease), background .18s var(--ease);
}
.themebtn:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 7%, transparent); }

.site-foot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px;
  color: var(--fg3); font-size: 11.5px; letter-spacing: .02em;
}

/* ----------------------------------------------------------- 进场动效 */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .9s var(--ease-out) both; }
.d1 { animation-delay: .1s; }

@media (max-width: 560px) {
  /* 字标字号与光标都跟着 em 走，这里只需要收紧上边距 */
  .brand { margin-bottom: 40px; }
  .site-foot { padding: 14px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<button class="themebtn" id="theme" type="button" title="切换浅色 / 深色" aria-label="切换主题">
  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
  </svg>
</button>

<main class="hero">
  <!-- Logo 即入口：不解释、不引导，点进去自然知道怎么用 -->
  <a class="brand rise" id="entry" href="quiz.html" aria-label="进入 QuizForge">
    <span class="brand__word">QuizForge</span><span class="brand__caret" aria-hidden="true"></span>
  </a>

  <div class="slogan-wrap rise d1">
    <!-- 第一句不带句点：句子没结束，视线自然落到下面那句上 -->
    <h1 class="slogan" id="slogan">All you need is curiosity</h1>
    <!-- 彩蛋：把指针停在 slogan 上五秒，表层失焦，它才浮现。指针一移开就收回。 -->
    <p class="egg" id="egg" aria-hidden="true">All you need is the courage of curiosity.</p>
  </div>
</main>

<footer class="site-foot">
  <span>QuizForge</span>
  <span id="hint" hidden>按 Enter 直接进入</span>
</footer>

<script>
(function () {
  var KEY = 'quizforge.v1.settings';

  /* ------------------------------------------------------------ 主题 */
  function read() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  document.getElementById('theme').onclick = function () {
    var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { var s = read(); s.theme = next; localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  };

  /* ------------------------------------------------------------ 粒子 */
  // 单色尘埃为底，紫与绿是仅有的彩色；几团大半径光斑负责「模糊点缀」。
  // 深色档把明度压低 —— 要的是深海浮游生物，不是霓虹灯。
  var canvas = document.getElementById('bg');
  if (canvas && canvas.getContext) {
    var ctx = canvas.getContext('2d');
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0, parts = [], glows = [], raf = 0;
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var t0 = performance.now();
    var PAL = null;

    function readPalette() {
      PAL = document.documentElement.dataset.theme === 'light'
        ? { dust: [10, 10, 10],      purple: [124, 58, 237],  green: [13, 148, 136],  dustA: .10, accA: .40, glowA: .07 }
        : { dust: [250, 250, 250],   purple: [167, 139, 250], green: [45, 212, 191],  dustA: .11, accA: .48, glowA: .09 };
    }
    function spawn() {
      var n = Math.max(36, Math.min(120, Math.round(W * H / 14000)));
      var i, roll;
      parts = [];
      for (i = 0; i < n; i++) {
        roll = Math.random();
        var kind = roll < .3 ? (Math.random() < .5 ? 'purple' : 'green') : 'dust';
        parts.push({
          x: Math.random() * W, y: Math.random() * H,
          r: kind === 'dust' ? .7 + Math.random() * 1.3 : 1 + Math.random() * 1.8,
          vx: (Math.random() - .5) * .14, vy: (Math.random() - .5) * .11,
          ph: Math.random() * 6.283, sp: .25 + Math.random() * .7, kind: kind
        });
      }
      glows = [];
      for (i = 0; i < 4; i++) {
        glows.push({
          cx: Math.random() * W, cy: Math.random() * H,
          r: 130 + Math.random() * 160, kind: i % 2 ? 'purple' : 'green',
          ox: 40 + Math.random() * 70, oy: 30 + Math.random() * 60,
          ph: Math.random() * 6.283, sp: .05 + Math.random() * .06
        });
      }
    }
    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      spawn();
    }
    function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
    function frame(now) {
      var t = (now - t0) / 1000, i, p, gl, c;
      ctx.clearRect(0, 0, W, H);
      for (i = 0; i < glows.length; i++) {
        gl = glows[i];
        var gx = gl.cx + Math.cos(t * gl.sp * 2 + gl.ph) * gl.ox;
        var gy = gl.cy + Math.sin(t * gl.sp * 1.6 + gl.ph) * gl.oy;
        c = PAL[gl.kind];
        var grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, gl.r);
        grad.addColorStop(0, rgba(c, PAL.glowA));
        grad.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = grad;
        ctx.fillRect(gx - gl.r, gy - gl.r, gl.r * 2, gl.r * 2);
      }
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < -4) p.x = W + 4; else if (p.x > W + 4) p.x = -4;
        if (p.y < -4) p.y = H + 4; else if (p.y > H + 4) p.y = -4;
        var tw = .6 + .4 * Math.sin(t * p.sp + p.ph);
        c = p.kind === 'dust' ? PAL.dust : PAL[p.kind];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, 6.2832);
        ctx.fillStyle = rgba(c, ((p.kind === 'dust' ? PAL.dustA : PAL.accA) * tw).toFixed(3));
        ctx.fill();
      }
      if (!reduced) raf = requestAnimationFrame(frame);
    }
    readPalette(); resize();
    frame(performance.now());
    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', function () {
      if (reduced) return;
      if (document.hidden) cancelAnimationFrame(raf);
      else raf = requestAnimationFrame(frame);
    });
    // 主题切换时只换色板，粒子位置不动 —— 反色不该是一场重新洗牌
    new MutationObserver(readPalette).observe(document.documentElement,
      { attributes: true, attributeFilter: ['data-theme'] });
  }

  /* ------------------------------------------------------------ 彩蛋 */
  // 停满 5 秒才浮现；指针一移开立刻收回，想再看一次就得重新等。
  // 触屏没有悬停 —— 按住不放是同一个动作。
  var slogan = document.getElementById('slogan');
  var egg = document.getElementById('egg');
  var revealed = false, timer = null;

  function arm() { if (revealed || timer) return; timer = setTimeout(reveal, 5000); }
  function disarm() { if (timer) { clearTimeout(timer); timer = null; } }
  function reveal() {
    revealed = true; timer = null;
    document.body.classList.add('egg-on');
    egg.setAttribute('aria-hidden', 'false');
  }
  function hide() {
    if (!revealed) return;
    revealed = false;
    // 先把过渡关掉再改状态，改完下一帧恢复 —— 回位是「啪」的一下，不是慢慢淡回去
    document.body.classList.add('egg-reset');
    document.body.classList.remove('egg-on');
    egg.setAttribute('aria-hidden', 'true');
    requestAnimationFrame(function () { document.body.classList.remove('egg-reset'); });
  }

  slogan.addEventListener('mouseenter', arm);
  slogan.addEventListener('mouseleave', function () { disarm(); hide(); });
  slogan.addEventListener('touchstart', arm, { passive: true });
  slogan.addEventListener('touchend', function () { disarm(); hide(); });
  slogan.addEventListener('touchcancel', function () { disarm(); hide(); });

  /* ------------------------------------------------------------ 入口 */
  // Logo 是唯一入口。离线直接去 quiz.html；在线先问一句登录态，
  // 已登录进题库、未登录去登录页 —— 都不需要在页面上多写一个字。
  var entry = document.getElementById('entry');
  var hint = document.getElementById('hint');
  var online = window.QF_CONFIG && window.QF_CONFIG.mode === 'online';

  if (!online) {
    hint.hidden = false;
  } else {
    var API = window.QF_CONFIG.apiBase || '/api';
    fetch(API + '/auth/me', { credentials: 'same-origin' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (data && data.user) {
          entry.setAttribute('href', 'quiz.html');
          hint.hidden = false;
        } else {
          entry.setAttribute('href', 'login.html');
        }
      })
      .catch(function () { entry.setAttribute('href', 'login.html'); });
  }

  window.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
    var el = document.activeElement;
    if (el && (el.tagName === 'BUTTON' || el.tagName === 'A')) return;
    e.preventDefault();
    entry.click();
  });
})();
</script>
</body>
</html>
