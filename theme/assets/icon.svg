<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img"
     aria-label="QFStudio">
  <rect x="14.0" y="14.0" width="228.0" height="228.0" rx="55.0" fill="#F0F4F8"/>
  <defs>
    <!-- 右下角的缺口（圆角矩形）：环在这里断开（Q 的尾巴） -->
    <mask id="notch" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <rect x="140.0" y="140.0"
            width="60.0" height="60.0"
            rx="17.5" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#notch)">
    <circle cx="128" cy="128" r="64.0" fill="#17203A"/>
    <circle cx="128" cy="128" r="40.0" fill="#F0F4F8"/>
    <circle cx="128" cy="128" r="35.5" fill="#17203A"/>
  </g>
  <circle cx="157.5" cy="157.5" r="17.5" fill="#2DD4BF"/>
</svg>
