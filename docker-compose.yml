# quizforge · 一个 Postgres 容器 —— **只为搬历史数据而留**。
#
# 应用本身早就不需要库服务了：数据是本机的 `data/quizforge.db`（SQLite），
# 首启自己建表（`app.db.ensure_schema`，alembic 已退役）。这个容器只在两种时候用：
#
#   1) 从版本库里的快照搬题进来：
#        make db-up && make db-restore && python tools/migrate_to_local.py
#      （搬运逐表对账，搬完就可以 `make db-down` 了）
#   2) 更新那份快照：`make db-dump` —— 结果进版本库（`db/quizforge.sql.gz`）
#
# 这里原先还有两条服务，都在「local-first + 单文件打包」之后退役：
#
#   * `api` —— 靠 api/Dockerfile 多阶段构建，镜像内跑前端构建。现在打包走
#     PyInstaller（`make package` / `dist-linux`），Dockerfile 已删；
#   * `graph` —— 一个 Neo4j。图谱的边本来就在库里（`point_edges` /
#     `concept_edges`），遍历用 SQL 就够，那份图数据库没有被任何代码引用。
#
# 见 `.codebuddy/plans/quizforge-next-version*.md` 里的原话：
# "docker-compose.yml 与 db-up / docker-up 系列目标退役"。

name: quizforge

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizforge
      POSTGRES_PASSWORD: quizforge
      POSTGRES_DB: quizforge
      # 内容全是中文与代码，固定 UTF8 + C locale 让排序/索引行为可预期
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 只绑本机，避免开发机的 5432 直接暴露到局域网
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizforge -d quizforge"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
