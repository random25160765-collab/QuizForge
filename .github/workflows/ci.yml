# 每次推送都验一遍：**照着 README 能不能在干净环境里把服务跑起来**。
#
# ## 为什么要有它
#
# 这条路径的失败方式全是"只有新机器才暴露"的那种。实测抓到过两次，
# 都是干净克隆才现形、在开发机上永远不复现：
#
#   * **快照恢复到一半崩了** —— `tools/db_snapshot.py` 里建 `data/` 目录那一步
#     排在解压之后，而新机器上那个目录根本不存在。于是当时 README 的**第二条命令**
#     直接失败，人还没走到起服务就断了。（该路径 2026-11-08 起已移出仓库。）
#   * **三个入口各指一页** —— 顶层 `/` 跳 `quiz.html`（刷题）、`make api-dev`
#     提示 `notes.html`（笔记）、README 说"对话是主入口"（`chat.html`）。
#     单独看每个都合理，合起来就是"打开首页看到的不是首页"。
#
# 这两类问题 `make test` 一条都抓不到 —— 它跑在"已经跑起来的机器"上。
#
# ## 所以这个 job 刻意不做的事
#
# **不用任何快捷目标绕过 README 的路径。** 跑的就是 README 里的命令本身，
# 一步不改、顺序不动。少一条、顺序错了、或者哪一步在干净环境里其实会崩，
# 它就会红 —— 这才是"给 agent 一句话就能拉起服务"的兜底。
#
# 2026-11-08 起数据不进版本库，干净克隆是**空库**（表由首启建好，题是 0）。
# README 的起步命令因此从三条变成两条（去掉了 `make db-restore`），
# 起服务后的题库非空断言也不再是 CI 能验的事 —— 它只在有库的机器上由
# `make check` 负责。后端 pytest 不受影响：它用的是随代码提交的合成题库
# 夹具（`api/tests/fixtures/bank/`），和本机有没有真实题库无关。
#
# 验收逻辑在 `tools/checks/serve_smoke.sh` 里（仓库里的一份可读文本，
# 本地也能直接跑），这里只负责按 README 起服务再调它。
#
# ## 后端测试也跑（2026-09-22 纳入）
#
# `make api-test`（474 项）此前一直没进 CI，理由是"有 5 项既存失败"：
# `test_beta_channel` 4 条 + `test_ai_per_user` 1 条。它们假设"连不上上游时，
# 错误里该带『内测通道』/『你填写的接口』"，而那条路径实际走不到 ——
# 请求在连接阶段超时（`ConnectTimeout`），而它的父类是 `TimeoutException`
# **不是** `ConnectError`，于是被 `except httpx.TimeoutException` 吞掉，
# 用户只看到"AI 服务响应超时"。
#
# 也就是说：**测试是对的，代码是错的**。它发现了一个真缺陷 —— 够不着上游的人
# 拿不到那半句指点（该去找站长，还是该查自己的地址）。
#
# 教训留在这里：拿"几项既存失败"当理由让整套测试不跑，等于用 5 个红灯
# 换 469 个不设防。修好它们之后 474 项全绿，所以现在纳入。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------- 干净克隆 → 跑起来
  fresh-clone:
    name: 干净克隆 → 照 README 跑起来
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ================= README「跑起来」那两条，一步不改 =================
      - name: ① make api-venv
        run: make api-venv

      # ② 与验收合在一步里：`make api-dev` 是**前台阻塞**的（README 里写明了），
      # 这里丢后台，然后**必须在同一个 shell 里**等验完 ——
      # 跨 step 的后台进程在 Actions 上会随 shell 一起被收走。
      # `SMOKE_REQUIRE_BANK=0`：干净克隆本来就没有题（数据不进版本库）。
      - name: ② make api-dev（丢后台）+ 验收
        run: |
          nohup make api-dev > /tmp/quizforge.log 2>&1 &
          SMOKE_REQUIRE_BANK=0 bash tools/checks/serve_smoke.sh http://127.0.0.1:8100
      # ================== 到此为止是 README 的全部 ==================

      - name: 起不来时把服务日志带出来
        if: failure()
        run: cat /tmp/quizforge.log || true

  # ------------------------------------------------------------- 常规校验
  check:
    name: 题库校验 + 前端自测
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: make api-venv
        run: make api-venv

      # 数据不在版本库里，CI 没有题库可校 —— `QF_SKIP_BANK_CHECK=1` 只跳过
      # 题库/前端联测那一段，密钥扫描与 JS 语法门禁照跑。题库校验在有库的
      # 机器上由裸 `make check` / `make test` 负责。
      - name: make check（密钥扫描；题库校验需要本机数据）
        run: QF_SKIP_BANK_CHECK=1 make check

      - name: make test（语法门禁；题库/前端联测需要本机数据）
        run: QF_SKIP_BANK_CHECK=1 make test

      # `make web` 必须排在它前面：后端有 3 项测试要 `api/web` 这个产物 ——
      # `test_startup` 查首页在不在，`test_chat` 与 `test_tools` 要 demo-kit。
      # 本地没暴露是因为开发机上 `api/web` 早就在了（跑过一次 `make web` 就一直在）；
      # CI 每次都是干净的，所以只有它会红。
      - name: make web（构建前端产物 —— 后端测试有 3 项依赖它）
        run: make web

      # 题库用 `api/tests/fixtures/bank/` 里的合成夹具，不依赖本机数据。
      - name: make api-test（后端 pytest）
        run: make api-test
