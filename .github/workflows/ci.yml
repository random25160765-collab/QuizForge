# 每次推送都验一遍：**照着 README 能不能在干净环境里把服务跑起来**。
#
# ## 为什么要有它
#
# 这条路径的失败方式全是"只有新机器才暴露"的那种。实测抓到过两次，
# 都是干净克隆才现形、在开发机上永远不复现：
#
#   * **快照恢复到一半崩了** —— `tools/db_snapshot.py` 里建 `data/` 目录那一步
#     排在解压之后，而新机器上那个目录根本不存在。于是 README 的**第二条命令**
#     直接失败，人还没走到起服务就断了。
#   * **三个入口各指一页** —— 顶层 `/` 跳 `quiz.html`（刷题）、`make api-dev`
#     提示 `notes.html`（笔记）、README 说"对话是主入口"（`chat.html`）。
#     单独看每个都合理，合起来就是"打开首页看到的不是首页"。
#
# 这两类问题 `make test` 一条都抓不到 —— 它跑在"已经跑起来的机器"上。
#
# ## 所以这个 job 刻意不做的事
#
# **不用任何快捷目标绕过 README 的路径。** 跑的就是那三条命令本身，
# 一步不改、顺序不动。少一条、顺序错了、或者哪一步在干净环境里其实会崩，
# 它就会红 —— 这才是"给 agent 一句话就能拉起服务"的兜底。
#
# 验收逻辑在 `tools/checks/serve_smoke.sh` 里（仓库里的一份可读文本，
# 本地也能直接跑），这里只负责按 README 起服务再调它。
#
# ## 没纳入的
#
# `make api-test`（后端 pytest）暂未纳入：当前有 5 项既存失败
# （`test_beta_channel` 4 条 + `test_ai_per_user` 1 条，见 `docs/STATUS.md` §五）——
# 它们假设"连不上上游时提示里带『内测通道』"，而那个"死地址"在不通与通（返回 5xx）
# 两种情况下走的是不同分支。修掉再纳入，否则 CI 常红、然后大家就不看它了。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------- 干净克隆 → 跑起来
  fresh-clone:
    name: 干净克隆 → 照 README 跑起来
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ================= README「跑起来」那三条，一步不改 =================
      - name: ① make api-venv
        run: make api-venv

      - name: ② make db-restore
        run: make db-restore

      # ③ 与验收合在一步里：`make api-dev` 是**前台阻塞**的（README 里写明了），
      # 这里丢后台，然后**必须在同一个 shell 里**等验完 ——
      # 跨 step 的后台进程在 Actions 上会随 shell 一起被收走。
      - name: ③ make api-dev（丢后台）+ 验收
        run: |
          nohup make api-dev > /tmp/quizforge.log 2>&1 &
          bash tools/checks/serve_smoke.sh http://127.0.0.1:8100
      # ================== 到此为止是 README 的全部 ==================

      - name: 起不来时把服务日志带出来
        if: failure()
        run: cat /tmp/quizforge.log || true

  # ------------------------------------------------------------- 常规校验
  check:
    name: 题库校验 + 前端自测
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 这两步的先后是有讲究的：`db-restore` 走的是 venv 里的 python
      # （`tools/db_snapshot.py`），所以环境得先建好。
      - name: make api-venv
        run: make api-venv

      - name: make db-restore
        run: make db-restore

      - name: make check（密钥扫描 + 题库校验）
        run: make check

      - name: make test（题库校验 + 前端断言 + 语法门禁）
        run: make test
