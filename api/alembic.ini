# Alembic 配置
#
# 数据库地址**不写在这里**：由 alembic/env.py 从 app.config 读环境变量，
# 避免同一个 URL 维护两份（一份在 .ini，一份在 .env，迟早对不上）。

[alembic]
script_location = alembic
prepend_sys_path = .
# 迁移文件名带时间戳，保证目录里按时间排序可读
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
